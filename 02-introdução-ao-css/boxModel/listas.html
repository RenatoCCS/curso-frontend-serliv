<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <title>Listas</title>
    <style>
      body {
        font-family: sans-serif;
      }

      ul li {
        list-style-type: square;
        /* Outras formas: circle e disc que é padrão. E none para não mostrar. */
        list-style-position: inside;
        /* Outras formas: Outside é padrão fica fora da lista. */
      }

      ol li {
        list-style-type: decimal;
        /* Outras formas: upper ou lower-aplha/latin mesma coisa e roman(números romanos). */
      }
    </style>
  </head>
  <body>
    <h1>Listas</h1>

    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ul>

    <ol>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ol>
  </body>
</html>
